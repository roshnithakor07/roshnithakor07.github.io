  <rect x="788" y="338" width="64" height="22" rx="11" fill="#083344"/><text x="820" y="354" fill="#67e8f9" font-size="12" text-anchor="middle" font-weight="700">LOGIC</text>
  <text x="864" y="354" fill="#8b87b3" font-size="12">line 46</text>
  <text x="788" y="386" fill="#e5e3f5" font-size="14">Org check runs before permission</text>
  <text x="788" y="408" fill="#e5e3f5" font-size="14">lookup: good, tenant data stays</text>
