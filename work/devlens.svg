  <text x="700" y="114" fill="#8b87b3" font-size="13" text-anchor="end">+12 −4</text>
  <line x1="24" y1="130" x2="724" y2="130" stroke="#2d2a5a"/>
  <g font-size="15">
    <text x="48" y="164" fill="#5e5a80">41</text><text x="96" y="164" fill="#b9b5d6">canActivate(ctx: ExecutionContext) {</text>
    <text x="48" y="194" fill="#5e5a80">42</text><text x="96" y="194" fill="#b9b5d6">  const user = this.auth.fromRequest(ctx);</text>
    <rect x="24" y="206" width="700" height="30" fill="#3b1220"/>
    <text x="48" y="226" fill="#f87171">−</text><text x="96" y="226" fill="#fca5a5">  logger.debug(`auth ${user.token}`);</text>
    <rect x="24" y="236" width="700" height="30" fill="#0b3b2e"/>
    <text x="48" y="256" fill="#4ade80">+</text><text x="96" y="256" fill="#bbf7d0">  logger.debug(`auth user=${user.id}`);</text>
    <rect x="24" y="266" width="700" height="30" fill="#0b3b2e"/>
    <text x="48" y="286" fill="#4ade80">+</text><text x="96" y="286" fill="#bbf7d0">  const orgId = ctx.switchToHttp()</text>
    <rect x="24" y="296" width="700" height="30" fill="#0b3b2e"/>
    <text x="48" y="316" fill="#4ade80">+</text><text x="96" y="316" fill="#bbf7d0">    .getRequest().params.orgId;</text>
    <rect x="24" y="326" width="700" height="30" fill="#0b3b2e"/>
    <text x="48" y="346" fill="#4ade80">+</text><text x="96" y="346" fill="#bbf7d0">  if (user.orgId !== orgId) return false;</text>
    <text x="48" y="384" fill="#5e5a80">47</text><text x="96" y="384" fill="#b9b5d6">  return this.perms.has(user, ctx.handler);</text>
    <text x="48" y="414" fill="#5e5a80">48</text><text x="96" y="414" fill="#b9b5d6">}</text>
  </g>
  <rect x="48" y="450" width="652" height="1" fill="#2d2a5a"/>
  <text x="48" y="486" fill="#8b87b3" font-size="14">Scope: only changed hunks are sent for review</text>
