<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 750" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- Placeholder illustration of DevLens (AI code review): a diff on the left, streamed review comments on the right -->
  <rect width="1200" height="750" fill="#0f0c2e"/>
